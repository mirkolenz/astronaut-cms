image: node:24

pages:
  variables:
    SITE_URL: https://${CI_PROJECT_NAMESPACE}.gitlab.io
    BASE_PATH: /${CI_PROJECT_NAME}
  before_script:
    - npm ci
    - npm run build
  script:
    - npm run build --workspace=docs
    - mv docs/dist public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
